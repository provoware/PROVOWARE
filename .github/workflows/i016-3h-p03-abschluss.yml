name: I016.3H P03-Abschluss

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p03-abschluss:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Maschinenlesbaren P03-Abschluss prüfen
        shell: python
        run: |
          import json
          from pathlib import Path

          p = json.loads(Path('PROJEKTSTATUS.json').read_text(encoding='utf-8'))
          b = json.loads(Path('CURRENT_BASELINE.json').read_text(encoding='utf-8'))
          d = json.loads(Path('docs/PLAN_DELTA_I014.json').read_text(encoding='utf-8'))
          h = json.loads(Path('ITERATIONSUEBERGABE.json').read_text(encoding='utf-8'))

          q = p['i016_lease_stale_replace_qualifikation']
          assert q['status'] == 'VALIDIERT_GITHUB'
          assert q['workflow_run_id'] == 31511070448
          assert q['workflow_status'] == 'completed'
          assert q['workflow_conclusion'] == 'success'
          assert q['github_qualifikations_head'] == '403bba4b2ae6e8a79e573e95dca7f2308c37207f'
          assert q['github_main_merge_commit'] == 'a4b63b758bf5ef71060d2e73eae95d584be13fbe'
          assert q['tool_pr'] == 36
          assert q['workflow_artifacts'] == 'KEINE_PUBLIZIERT'
          assert q['nicht_kooperierende_schreiber'] == 'NICHT_QUALIFIZIERT'
          assert q['netzwerkdateisysteme'] == 'NICHT_QUALIFIZIERT'

          assert p['p03_fortschritt_prozent'] == 100
          assert p['p03_plan_delta_verschluss_prozent'] == 100
          assert p['letzte_abgeschlossene_iteration'] == 'I016'
          assert p['naechste_iteration'] == 'I017'
          assert p['status'] == 'IN_ARBEIT'

          assert b['baseline_id'] == p['aktuelle_baseline'] == 'BASELINE-2026-08-10-I015'
          assert b['github_artifact_id'] == 9058982637
          assert b['github_artifact_sha256'] == '448c1aa364596e78ad3fe73a86aaafdda10dfd2e1253ae8ce14858876700f73f'
          assert b['letzte_iteration'] == 'I016'
          assert b['naechste_iteration'] == 'I017'
          assert 'kein nicht existentes I016-Artifact' in b['source']

          assert d['delta_id'] == 'PLAN-DELTA-P03-2026-08-10-001'
          assert d['status'] == 'ABGESCHLOSSEN'
          assert d['abschlussnachweis']['status'] == 'PASS_REAL'
          assert d['abschlussnachweis']['workflow_run_id'] == 31511070448
          assert d['abschlussnachweis']['workflow_conclusion'] == 'success'
          assert d['abschlussnachweis']['main_merge_commit'] == 'a4b63b758bf5ef71060d2e73eae95d584be13fbe'
          assert d['aufgeschobene_planpunkte'] == []
          assert d['p04_neuzuordnung']['i017']['ziel'] == 'dauerhafte ID-Erzeugung und Validierung'
          assert d['p04_neuzuordnung']['i018']['ziel'] == 'Versions- und Manifestregistry'

          assert h['next_iteration'] == 'I017'
          assert h['plan_identity']['closed_delta_id'] == 'PLAN-DELTA-P03-2026-08-10-001'
          assert h['plan_identity']['project_mapping_p04_i017'] == 'dauerhafte ID-Erzeugung und Validierung'
          assert h['plan_identity']['project_mapping_p04_i018'] == 'Versions- und Manifestregistry'
          assert h['plan_identity']['number_collision_resolved'] is True

      - name: Historische Lifecycle-Gates promotionsfest prüfen
        shell: python
        run: |
          from pathlib import Path

          manual_only = [
              '.github/workflows/i015-3-plan-identitaet.yml',
              '.github/workflows/i016-2h-metadatenabschluss.yml',
              '.github/workflows/i016-3-lease-stale-replace.yml',
          ]
          for path in manual_only:
              w = Path(path).read_text(encoding='utf-8')
              pre = w.split('permissions:', 1)[0]
              assert 'workflow_dispatch:' in pre, path
              assert 'pull_request:' not in pre, path

          i014 = Path('.github/workflows/i014-dateiidentitaet.yml').read_text(encoding='utf-8')
          pre014 = i014.split('permissions:', 1)[0]
          assert 'pull_request:' in pre014
          assert 'docs/PLAN_DELTA_I014.json' not in pre014
          assert 'src/provoware/plattform/dateiidentitaet.py' in pre014
          assert 'tests/platform/test_dateiidentitaet.py' in pre014

      - name: Baseline-Validator ausführen
        run: python3 WERKZEUGE/baseline_pruefen.py

      - name: Dokumentation und Changelog konsistent prüfen
        shell: python
        run: |
          from pathlib import Path

          docs = '\n'.join([
              Path('docs/ITERATION_016.md').read_text(encoding='utf-8'),
              Path('docs/ITERATION_016_3.md').read_text(encoding='utf-8'),
              Path('CHANGELOG.md').read_text(encoding='utf-8'),
          ])
          required = [
              '31511070448',
              '403bba4b2ae6e8a79e573e95dca7f2308c37207f',
              'a4b63b758bf5ef71060d2e73eae95d584be13fbe',
              'PLAN-DELTA-P03-2026-08-10-001',
              'NICHT_QUALIFIZIERT',
              'I017',
              'I018',
          ]
          for marker in required:
              assert marker in docs, f'Dokumentation fehlt: {marker}'
