name: I018.1H Metadatenverschluss

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  metadatenverschluss:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: JSON und Lifecycle-Invarianten prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('PROJEKTSTATUS.json').read_text())
          proof = json.loads(Path('docs/I018_1H_METADATENVERSCHLUSS.json').read_text())
          baseline = json.loads(Path('CURRENT_BASELINE.json').read_text())
          handoff = json.loads(Path('ITERATIONSUEBERGABE.json').read_text())

          q = status.get('i018_1_registry_source_fingerprint_qualifikation', {})
          assert q.get('status') == 'VALIDIERT_GITHUB'
          assert q.get('tool_pr') == 47
          assert q.get('workflow_run_id') == 31590478317
          assert q.get('workflow_conclusion') == 'success'
          assert q.get('github_qualifikations_head') == 'd4c85ffc7b28c0e33dcd504c2155794caca8eaea'
          assert q.get('github_main_merge_commit') == 'c6322ec2251fc8c54c2648c586572e34a14409e0'
          assert q.get('masterbuch_workflow_run_id') == 31590656723
          assert q.get('masterbuch_main_merge_commit') == '6666c37071312424d24c118428bffa1cf19a46c0'
          assert q.get('source_fingerprint') == 'SHA256_KANONISCHE_SERIALISIERUNG_QUALIFIZIERT'
          assert q.get('fingerprint_pin') == 'FAIL_CLOSED_GRUEN'
          assert q.get('nicht_kanonisierbare_quelle') == 'FAIL_CLOSED_GRUEN'
          assert q.get('registry_persistenz') == 'NICHT_IMPLEMENTIERT'
          assert q.get('automatische_quellensuche') == 'NICHT_IMPLEMENTIERT'
          assert q.get('registry_contract_fingerprint') == 'NICHT_IMPLEMENTIERT'
          assert q.get('mehrprojekt_registry') == 'NICHT_IMPLEMENTIERT'
          assert q.get('gui') == 'NICHT_IMPLEMENTIERT'

          assert status.get('letzte_abgeschlossene_iteration') == 'I017'
          assert status.get('naechste_iteration') == 'I018'
          assert 67 < status.get('p04_fortschritt_prozent', 0) < 100
          assert baseline.get('letzte_iteration') == 'I017'
          assert baseline.get('naechste_iteration') == 'I018'
          assert handoff.get('next_iteration') == 'I018'

          assert proof.get('status') == 'KANDIDAT'
          mb = proof.get('masterbuch_evidence', {})
          assert mb.get('erk_id') == 'ERK-I018-002'
          assert mb.get('typ') == 'Nachweis'
          assert mb.get('hauptkategorie') == 'Architektur'
          assert mb.get('reifegrad') == 'E2'
          assert mb.get('prioritaet') == 'P0'
          assert mb.get('automatisierbarkeit') == 'JA'
          assert mb.get('status') == 'BESTAETIGT'
          assert mb.get('goldene_regel') is False
          assert mb.get('widersprueche') == []
          mutation = proof.get('mutation', {})
          assert all(value is False for value in mutation.values())
          PY

      - name: Changelog-Evidence prüfen
        run: |
          grep -F 'I018.1H' CHANGELOG.md
          grep -F '31590478317' CHANGELOG.md
          grep -F 'c6322ec2251fc8c54c2648c586572e34a14409e0' CHANGELOG.md
          grep -F '31590656723' CHANGELOG.md
          grep -F '6666c37071312424d24c118428bffa1cf19a46c0' CHANGELOG.md
          grep -F 'ERK-I018-002' CHANGELOG.md

      - name: Historisches I018.0H-Gate eingefroren prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          pre = Path('.github/workflows/i018-0h-metadatenverschluss.yml').read_text().split('permissions:', 1)[0]
          assert 'workflow_dispatch:' in pre
          assert 'pull_request:' not in pre
          assert 'push:' not in pre
          print('Historisches I018.0H-Gate: workflow_dispatch-only')
          PY

      - name: Abschluss
        run: echo 'I018.1H historisches Gate eingefroren'
