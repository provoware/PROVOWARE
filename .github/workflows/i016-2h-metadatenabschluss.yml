name: I016.2H Metadatenabschluss

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-evidence:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Historische I016.2-Evidence read-only prüfen
        shell: python
        run: |
          import json
          from pathlib import Path

          p = json.loads(Path('PROJEKTSTATUS.json').read_text(encoding='utf-8'))
          q = p['i016_datei_lease_mehrprozess_qualifikation']
          assert q['status'] == 'VALIDIERT_GITHUB'
          assert q['workflow_run_id'] == 31490138072
          assert q['workflow_status'] == 'completed'
          assert q['workflow_conclusion'] == 'success'
          assert q['github_qualifikations_head'] == '0be678f4c9bffee072253c4b117e6658145a709a'
          assert q['github_main_merge_commit'] == '38f873b55a4539147458ed8a76ad4ac4f4e3e116'
          assert q['tool_pr'] == 34
          assert q['nicht_kooperierende_schreiber'] == 'NICHT_QUALIFIZIERT'
          assert q['netzwerkdateisysteme'] == 'NICHT_QUALIFIZIERT'
          assert p['i016_lease_stale_replace_qualifikation']['status'] == 'VALIDIERT_GITHUB'
          assert p['p03_fortschritt_prozent'] == 100
