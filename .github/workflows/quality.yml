name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Reproduzierbare Projektprüfung
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node 20 bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Quality Gate ausführen
        run: npm run verify
