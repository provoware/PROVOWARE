name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Reproduzierbare Projektprüfung · Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Node ${{ matrix.node-version }} bereitstellen
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Quality Gate ausführen
        run: npm run verify
