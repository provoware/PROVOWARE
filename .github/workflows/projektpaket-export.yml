name: Vollstaendiges Projektpaket

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen-und-packen:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Entwicklungswerkzeuge installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[entwicklung]'

      - name: Projekt vollständig prüfen
        run: |
          bash -n PROVOWARE_STARTEN.sh
          python WERKZEUGE/baseline_pruefen.py
          python WERKZEUGE/projekt_start.py
          python tools/historical_gate_linter.py
          ruff check src tests WERKZEUGE
          ruff format --check src tests WERKZEUGE
          mypy src/provoware
          python -m pytest -q

      - name: Masterbuch auschecken
        uses: actions/checkout@v4
        with:
          repository: provoware/PROVOWARE_MASTER_BOOK_2026
          ref: 30a96a1c445fc34ff4a2c8883d9374b540a60d43
          path: _masterbuch_quelle

      - name: Paket erstellen
        env:
          TOOL_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import stat
          from pathlib import Path

          workspace = Path.cwd()
          root = workspace / '_paket' / 'PROVOWARE_WISSENSSPEICHER_AKTUELL'
          shutil.rmtree(root.parent, ignore_errors=True)
          tool_target = root / 'PROVOWARE'
          master_target = root / 'PROVOWARE_MASTER_BOOK_2026'

          def ignore_tool(directory, names):
              blocked = {'.git', '.venv', '_paket', '_masterbuch_quelle', '__pycache__', '.pytest_cache', '.mypy_cache', '.ruff_cache'}
              return [name for name in names if name in blocked]

          shutil.copytree(workspace, tool_target, ignore=ignore_tool)
          shutil.copytree(workspace / '_masterbuch_quelle', master_target, ignore=shutil.ignore_patterns('.git'))

          start = tool_target / 'PROVOWARE_STARTEN.sh'
          start.chmod(start.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          outer_start = root / 'START_HIER.sh'
          outer_start.write_text('#!/usr/bin/env bash\nROOT="$(cd "$(dirname "$0")" && pwd)"\n"$ROOT/PROVOWARE/PROVOWARE_STARTEN.sh" "$@"\n', encoding='utf-8')
          outer_start.chmod(outer_start.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

          info = {
              'paket': 'PROVOWARE_WISSENSSPEICHER_AKTUELL',
              'datum': '2026-08-13',
              'tool_commit': os.environ['TOOL_SHA'],
              'masterbuch_commit': '30a96a1c445fc34ff4a2c8883d9374b540a60d43',
              'github_workflow_run_id': int(os.environ['RUN_ID']),
              'startdatei': 'START_HIER.sh',
              'pruefungen': ['Baseline', 'Schnellstart', 'Historische Gates', 'Ruff', 'Ruff Format', 'mypy strict', 'pytest Gesamtregression'],
              'projektstand': 'P04 50 Prozent; I019 ist der nächste Pflichtkern'
          }
          (root / 'PAKETINFO.json').write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          shutil.make_archive(str(workspace / 'PROVOWARE_WISSENSSPEICHER_AKTUELL'), 'zip', root.parent, root.name)
          PY
          sha256sum PROVOWARE_WISSENSSPEICHER_AKTUELL.zip > PROVOWARE_WISSENSSPEICHER_AKTUELL.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PROVOWARE_WISSENSSPEICHER_AKTUELL
          path: |
            PROVOWARE_WISSENSSPEICHER_AKTUELL.zip
            PROVOWARE_WISSENSSPEICHER_AKTUELL.zip.sha256
          if-no-files-found: error
          retention-days: 30
