name: I016.3 Lease-Stale-Replace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Historischen I016.3-Vertrag regressionsprüfen
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Testwerkzeug installieren
        run: python -m pip install pytest==9.1.1 ruff==0.16.1 mypy==2.3.0

      - name: I016.3 Vertrag prüfen
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/platform/test_sicherer_replace.py

      - name: Sicherheitsregression I014-I016
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/platform/test_dateiidentitaet.py
          python -m pytest -q tests/platform/test_atomarer_replace.py
          python -m pytest -q tests/platform/test_datei_lease.py
          python -m pytest -q tests/platform/test_datei_lease_mehrprozess.py

      - name: Statische Qualität
        run: |
          python -m ruff check src/provoware/plattform/sicherer_replace.py tests/platform/test_sicherer_replace.py
          python -m ruff format --check src/provoware/plattform/sicherer_replace.py tests/platform/test_sicherer_replace.py
          python -m mypy src/provoware/plattform

      - name: Historische Qualification-Evidence nicht umdeuten
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d = Path('docs/ITERATION_016_3.md').read_text(encoding='utf-8')
          assert '31511070448' in d
          assert '403bba4b2ae6e8a79e573e95dca7f2308c37207f' in d
          assert 'a4b63b758bf5ef71060d2e73eae95d584be13fbe' in d
          assert 'NICHT_QUALIFIZIERT' in d
          PY
