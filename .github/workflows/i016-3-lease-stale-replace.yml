name: I016.3 Lease-Stale-Replace

on:
  pull_request:
    branches: [main]
    paths:
      - "src/provoware/plattform/sicherer_replace.py"
      - "tests/platform/test_sicherer_replace.py"
      - "docs/WISSENSSPEICHER_I016_3_ERKENNTNIS.json"
      - "docs/ITERATION_016_3.md"
      - ".github/workflows/i016-3-lease-stale-replace.yml"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scope fail-closed pruefen
        run: |
          python3 - <<'PY'
          import os, subprocess
          allowed={
            'src/provoware/plattform/sicherer_replace.py',
            'tests/platform/test_sicherer_replace.py',
            'docs/WISSENSSPEICHER_I016_3_ERKENNTNIS.json',
            'docs/ITERATION_016_3.md',
            '.github/workflows/i016-3-lease-stale-replace.yml',
          }
          base=os.environ['GITHUB_BASE_REF']
          changed={p for p in subprocess.check_output(['git','diff','--name-only',f'origin/{base}...HEAD'],text=True).splitlines() if p}
          assert changed == allowed, f'I016.3-Scope abweichend: {sorted(changed)}'
          PY

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Testwerkzeug installieren
        run: python -m pip install pytest==9.1.1 ruff==0.16.1 mypy==2.3.0

      - name: I016.3 Vertrag qualifizieren
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/platform/test_sicherer_replace.py

      - name: Sicherheitsregression I014-I016
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/platform/test_dateiidentitaet.py
          python -m pytest -q tests/platform/test_atomarer_replace.py
          python -m pytest -q tests/platform/test_datei_lease.py
          python -m pytest -q tests/platform/test_datei_lease_mehrprozess.py

      - name: Statische Qualitaet
        run: |
          python -m ruff check src/provoware/plattform/sicherer_replace.py tests/platform/test_sicherer_replace.py
          python -m ruff format --check src/provoware/plattform/sicherer_replace.py tests/platform/test_sicherer_replace.py
          python -m mypy src/provoware/plattform

      - name: Wissensschema und Grenzen pruefen
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('docs/WISSENSSPEICHER_I016_3_ERKENNTNIS.json', encoding='utf-8'))
          assert d['typ']=='Regelentwurf'
          assert d['reifegrad']=='E1'
          assert d['prioritaet']=='P0'
          assert d['automatisierbarkeit']=='JA'
          assert d['status']=='IN_PRUEFUNG'
          assert d['goldene_regel'] is False
          assert d['dublettenpruefung']['status']=='AUSSTEHEND'
          PY
          grep -q 'NICHT_QUALIFIZIERT' docs/ITERATION_016_3.md
          grep -q 'AUSSTEHEND' docs/ITERATION_016_3.md
