name: I017H Metadatenabschluss

on:
  pull_request:
    paths:
      - 'PROJEKTSTATUS.json'
      - 'CHANGELOG.md'
      - 'docs/ITERATION_017.md'
      - '.github/workflows/i016-3h-p03-abschluss.yml'
      - '.github/workflows/i017-id-vertrag.yml'
      - '.github/workflows/i017h-metadatenabschluss.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i017h-metadatenabschluss:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Metadaten prüfen
        shell: python
        run: |
          import json
          from pathlib import Path
          status = json.loads(Path('PROJEKTSTATUS.json').read_text(encoding='utf-8'))
          q = status['i017_id_vertragskern_qualifikation']
          assert q['workflow_run_id'] == 31526518691
          assert q['github_qualifikations_head'] == 'be324f1cbbe30ee4e2c9f19e17b1855d5601c34c'
          assert q['github_main_merge_commit'] == '4e0a9f961c479932ac1e72c7b68367e200451ec9'
          assert q['masterbuch_main_merge_commit'] == 'd6b80cdc534ae3567b5a037e420f0bc30884f318'
          assert q['persistenz_anbindung'] == 'NICHT_IMPLEMENTIERT'
          assert q['registry_anbindung'] == 'NICHT_IMPLEMENTIERT'
          assert q['kollisionsfreiheit'] == 'NICHT_BEWIESEN'
          assert status['p04_fortschritt_prozent'] == 20
          for path in ('docs/ITERATION_017.md', 'CHANGELOG.md'):
              text = Path(path).read_text(encoding='utf-8')
              for marker in ('31526518691','4e0a9f961c479932ac1e72c7b68367e200451ec9','d6b80cdc534ae3567b5a037e420f0bc30884f318','PERSISTENZ_ANBINDUNG = NICHT_IMPLEMENTIERT','REGISTRY_ANBINDUNG = NICHT_IMPLEMENTIERT','KOLLISIONSFREIHEIT = NICHT_BEWIESEN'):
                  assert marker in text

      - name: Historische Gates eingefroren
        shell: python
        run: |
          from pathlib import Path
          for path in ('.github/workflows/i016-3h-p03-abschluss.yml','.github/workflows/i017-id-vertrag.yml'):
              pre = Path(path).read_text(encoding='utf-8').split('permissions:', 1)[0]
              assert 'workflow_dispatch:' in pre
              assert 'pull_request:' not in pre
