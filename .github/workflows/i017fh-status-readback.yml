name: I017FH Status-Readback

on:
  pull_request:
    paths:
      - 'docs/I017FH_STATUSABSCHLUSS.json'
      - '.github/workflows/i017fh-status-readback.yml'
  workflow_dispatch:

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: I017FH Nachweis fail-closed prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('docs/I017FH_STATUSABSCHLUSS.json').read_text())
          p=json.loads(Path('PROJEKTSTATUS.json').read_text())
          b=json.loads(Path('CURRENT_BASELINE.json').read_text())
          u=json.loads(Path('ITERATIONSUEBERGABE.json').read_text())
          assert r['status']=='IN_PRUEFUNG'
          assert r['ausgangs_merge']=='c3e28ce098b9b2f5d63d4fe53dffaae1e088b26e'
          assert b['letzte_iteration']=='I017' and b['naechste_iteration']=='I018'
          assert u['next_iteration']=='I018'
          assert p['letzte_abgeschlossene_iteration']=='I016'
          assert p['naechste_iteration']=='I017'
          assert r['befund']['konsistenz']=='NICHT_SYNCHRON'
          assert r['masterbuch']['neue_goldene_regel'] is False
          assert r['offene_grenzen']['crash_atomizitaet']=='NICHT_QUALIFIZIERT'
          PY
      - name: Scope auf reine Readback-Artefakte begrenzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = 'pull_request'
          pr="${{ github.event.pull_request.number }}"
          changed="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${pr}/files" --jq '.[].filename')"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sort)" = "$(printf '%s\n' '.github/workflows/i017fh-status-readback.yml' 'docs/I017FH_STATUSABSCHLUSS.json' | sort)"
