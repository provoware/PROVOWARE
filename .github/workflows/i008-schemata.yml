name: I008 Schema-Qualifikation

on:
  workflow_dispatch:
  push:
    branches:
      - iteration/i008-schemata
    paths:
      - ".github/workflows/i008-schemata.yml"
      - "src/provoware/vertraege/schemata.py"
      - "src/provoware/vertraege/__init__.py"
      - "tests/contract/test_schemata.py"
      - "tests/contract/test_i007_api_freeze.py"
      - "tests/fixtures/i008/**"
      - "tests/test_structure.py"
      - "VERSIONSREGISTER.json"
      - "ARCHITEKTURREGISTER.json"
      - "KOMPONENTENREGISTER.json"
      - "TRACEABILITY.json"
      - "EVIDENCE/I008/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/i008-schemata.yml"
      - "src/provoware/vertraege/schemata.py"
      - "src/provoware/vertraege/__init__.py"
      - "tests/contract/test_schemata.py"
      - "tests/contract/test_i007_api_freeze.py"
      - "tests/fixtures/i008/**"
      - "tests/test_structure.py"
      - "VERSIONSREGISTER.json"
      - "ARCHITEKTURREGISTER.json"
      - "KOMPONENTENREGISTER.json"
      - "TRACEABILITY.json"
      - "EVIDENCE/I008/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: i008-schemata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualifikation:
    name: Python 3.13.15 / Schemas / Golden-Fixtures
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      I005_RUN_ID: "31330952896"
      I005_ARTIFACT_ID: "9042907351"
      I005_ARTIFACT_SHA256: "6856c44cfd079b96f0daaa8e0fcebbba2dbbf5d0f1a3f16e02730f5851751040"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONHASHSEED: "0"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - name: Repository auschecken
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: CPython 3.13.15 bereitstellen
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Verifiziertes I005-Wheelhouse laden
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          artifact-ids: ${{ env.I005_ARTIFACT_ID }}
          path: .artefakte/i005-download
          github-token: ${{ github.token }}
          repository: provoware/PROVOWARE
          run-id: ${{ env.I005_RUN_ID }}
          skip-decompress: "true"
          digest-mismatch: error

      - name: I005-Artefakt prüfen und Toolchain offline installieren
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t ZIPS < <(find .artefakte/i005-download -type f -name '*.zip' -print)
          test ${#ZIPS[@]} -eq 1
          ZIP="${ZIPS[0]}"
          printf '%s  %s\n' "$I005_ARTIFACT_SHA256" "$ZIP" | sha256sum -c -
          mkdir -p .artefakte/i005
          unzip -q "$ZIP" -d .artefakte/i005
          python3 -m venv .venv-i008
          PIP_NO_INDEX=1 .venv-i008/bin/python -m pip install \
            --no-index \
            --find-links "$PWD/.artefakte/i005/wheelhouse" \
            pytest==9.1.1 ruff==0.16.1 mypy==2.3.0
          PIP_NO_INDEX=1 .venv-i008/bin/python -m pip check

      - name: Aktuelle Baseline und I008-Evidence revalidieren
        shell: bash
        run: |
          python3 WERKZEUGE/baseline_pruefen.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path('CURRENT_BASELINE.json').read_text(encoding='utf-8'))
          evidence = json.loads(Path('EVIDENCE/I008/TESTERGEBNIS.json').read_text(encoding='utf-8'))
          assert baseline['status'] == 'VALIDIERT_GITHUB'
          assert baseline['letzte_iteration'] >= 'I008'
          assert evidence['iteration'] == 'I008'
          assert evidence['status'] == 'GRUEN'
          assert evidence['qualifikationslauf']['artifact_id'] == 9044527742
          assert evidence['qualifikationslauf']['artifact_sha256'] == 'f58529730ac88675ab1b002130abca1f33e8ceffc4df8727c7a09e7ebf194e61'
          PY

      - name: Ruff prüfen
        shell: bash
        run: |
          .venv-i008/bin/ruff check src tests WERKZEUGE
          .venv-i008/bin/ruff format --check src tests WERKZEUGE

      - name: mypy strict prüfen
        shell: bash
        run: |
          .venv-i008/bin/mypy \
            src/provoware/vertraege \
            tests/contract/test_datentypen.py \
            tests/contract/test_id_varianten.py \
            tests/contract/test_i007_api_freeze.py \
            tests/contract/test_schemata.py

      - name: Contracttests und Golden-Fixtures
        shell: bash
        run: .venv-i008/bin/pytest -q -m contract tests/contract

      - name: Gesamte schnelle Regression
        shell: bash
        run: .venv-i008/bin/pytest -q

      - name: I008-Qualifikationsreceipt erzeugen
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .artefakte/I008
          .venv-i008/bin/python - <<'PY'
          from __future__ import annotations
          import json, os, platform
          from datetime import UTC, datetime
          from pathlib import Path

          receipt = {
              'schema': '1.0.0',
              'iteration': 'I008',
              'status': 'GRUEN',
              'zeit_utc': datetime.now(UTC).isoformat(),
              'github': {
                  'repository': os.environ.get('GITHUB_REPOSITORY'),
                  'sha': os.environ.get('GITHUB_SHA'),
                  'run_id': int(os.environ['GITHUB_RUN_ID']),
                  'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              },
              'plattform': {
                  'python': platform.python_version(),
                  'system': platform.system(),
                  'maschine': platform.machine(),
              },
              'toolchain': {
                  'quelle': 'verifiziertes I005-Wheelhouse',
                  'pytest': '9.1.1',
                  'ruff': '0.16.1',
                  'mypy': '2.3.0',
                  'pip_no_index': True,
              },
              'gates': {
                  'aktuelle_baseline': 'GRUEN',
                  'i008_evidence': 'GRUEN',
                  'i007_api_freeze': 'GRUEN',
                  'schema_produktversion_trennung': 'GRUEN',
                  'golden_fixtures': 'GRUEN',
                  'ruff_check': 'GRUEN',
                  'ruff_format': 'GRUEN',
                  'mypy_strict': 'GRUEN',
                  'contracttests': 'GRUEN',
                  'gesamtregression': 'GRUEN',
                  'architektur_importgrenze': 'GRUEN',
              },
          }
          Path('.artefakte/I008/I008_QUALIFIKATION.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          sha256sum .artefakte/I008/I008_QUALIFIKATION.json

      - name: I008-Evidence hochladen
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PROVOWARE-I008-schemata-${{ github.sha }}
          path: .artefakte/I008/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

      - name: Ergebnis zusammenfassen
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          {
            echo "## I008 — Schemas GRÜN"
            echo
            echo "- aktuelle validierte Baseline revalidiert"
            echo "- I008-Evidence unverändert verifiziert"
            echo "- I007 öffentliche API eingefroren"
            echo "- SchemaVersion und ProduktVersion getrennt"
            echo "- Manifest-/Projekt-Golden-Fixtures GRÜN"
            echo "- Ruff + mypy strict GRÜN"
            echo "- Contracttests + Gesamtregression GRÜN"
            echo "- Artifact-ID: ${ARTIFACT_ID}"
            echo "- Artifact-Digest: ${ARTIFACT_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
