name: I015.1 Metadata Closure Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "TRACEABILITY.json"
      - "EVIDENCE/I015/METADATA_CLOSURE.json"

permissions:
  contents: read

concurrency:
  group: i015-1-metadata-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: JSON / Historie / Traceability / Nichtmutation
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: I015.1 Metadaten fail-closed prüfen
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          closure_path = Path("EVIDENCE/I015/METADATA_CLOSURE.json")
          trace_path = Path("TRACEABILITY.json")
          changelog_path = Path("CHANGELOG.md")

          closure = json.loads(closure_path.read_text(encoding="utf-8"))
          trace = json.loads(trace_path.read_text(encoding="utf-8"))
          changelog = changelog_path.read_text(encoding="utf-8")

          assert closure["schema"] == "1.0.0"
          assert closure["iteration"] == "I015.1"
          assert closure["typ"] == "METADATA_CLOSURE"
          assert closure["status"] == "VORBEREITET"
          assert closure["basis"]["baseline"] == "BASELINE-2026-08-10-I015"
          assert closure["basis"]["workflow_run_id"] == 31378734347
          assert closure["basis"]["artifact_id"] == 9058982637
          assert closure["basis"]["artifact_sha256"] == "448c1aa364596e78ad3fe73a86aaafdda10dfd2e1253ae8ce14858876700f73f"
          assert closure["basis"]["receipt_sha256"] == "ef11d8315907029c31c19d0c003a6f42573d72ab0387c48e434121d549201703"
          assert closure["basis"]["produktmerge"] == "8052d9ce42014e6037c59b0aed47d8dcd2edecc1"

          assert trace["schema"] == "1.0.0"
          req = next(e for e in trace["eintraege"] if e["anforderung_id"] == "REQ-V1-003")
          for value in (
              "ARCH-018",
              "KMP-ATOMARER-REPLACE",
              "src/provoware/plattform/atomarer_replace.py",
              "tests/platform/test_atomarer_replace.py",
              "EVIDENCE/I015/PROMOTION.json",
          ):
              assert any(value in field for field in (
                  req.get("architektur", []),
                  req.get("komponenten", []),
                  req.get("implementierung", []),
                  req.get("tests", []),
                  req.get("evidence", []),
              )), value

          assert "### I015 — Atomarer Einzeldatei-Replace qualifiziert" in changelog
          assert "Lock-Lease aus P03" in changelog
          assert "Atomare Temp/Replace-Primitive und Lock-Lease" not in changelog

          baseline = json.loads(Path("CURRENT_BASELINE.json").read_text(encoding="utf-8"))
          status = json.loads(Path("PROJEKTSTATUS.json").read_text(encoding="utf-8"))
          assert baseline["letzte_iteration"] == "I015"
          assert baseline["naechste_iteration"] == "I016"
          assert baseline["status"] == "VALIDIERT_GITHUB"
          assert status["letzte_abgeschlossene_iteration"] == "I015"
          PY

      - name: Diff-Scope gegen Base prüfen
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          mapfile -t FILES < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort)
          printf '%s\n' "${FILES[@]}"
          ALLOWED=(
            "EVIDENCE/I015/METADATA_CLOSURE.json"
            "TRACEABILITY.json"
          )
          for file in "${FILES[@]}"; do
            ok=false
            for allowed in "${ALLOWED[@]}"; do
              if [[ "$file" == "$allowed" ]]; then ok=true; break; fi
            done
            [[ "$ok" == true ]] || { echo "Unerlaubte Datei im I015.1-Lifecycle-Diff: $file" >&2; exit 1; }
          done

      - name: Ergebnis
        shell: bash
        run: |
          {
            echo "## I015.1 Metadata Closure — GRÜN"
            echo
            echo "- historischer Trigger auf TRACEABILITY + I015.1-Evidence begrenzt"
            echo "- keine spätere CHANGELOG-/Folgeiterationsmutation reaktiviert das Gate"
            echo "- keine Produktlogik oder Nutzerdatenmutation"
          } >> "$GITHUB_STEP_SUMMARY"
