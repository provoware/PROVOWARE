name: I015.2H Masterbuch-Synchronisationsnachweis

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/I015_2G_MASTERBUCH_AUFNAHME_STATUS.json"
      - ".github/workflows/i015-2h-masterbook-sync.yml"

permissions:
  contents: read

jobs:
  sync:
    name: Masterbuch-Synchronisation / Read-only
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Synchronisationsnachweis fail-closed validieren
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('docs/I015_2G_MASTERBUCH_AUFNAHME_STATUS.json')
          d = json.loads(p.read_text(encoding='utf-8'))

          assert d['schema_version'] == '1.0'
          assert d['iteration'] == 'I015.2G'
          assert d['typ'] == 'MASTERBUCH_SYNCHRONISATIONSNACHWEIS'
          assert d['reifegrad'] == 'E2'
          assert d['prioritaet'] == 'P0'
          assert d['automatisierbarkeit'] == 'JA'
          assert d['status'] == 'KANONISCHE_AUFNAHME_PROMOVIERT'
          assert d['kanonische_masterbuch_mutation'] is True
          assert d['produktlogik_veraendert'] is False
          assert d['goldene_regel'] is False

          q = d['quelle_herkunft']
          assert q['kanonische_aufnahme_pr'] == 11
          assert q['kanonische_aufnahme_head'] == '6c4915529bfdcf2b1521eca6aef27bb0b3399086'
          assert q['kanonische_aufnahme_merge_commit'] == 'a70eccee1a0d7c9b9800d66f198bf4a02a6a9e53'
          assert q['lifecycle_gate_pr'] == 10
          assert q['lifecycle_gate_merge_commit'] == '0eebf83ce8bf2d21a525cae5c20fce9fc390211f'
          assert q['kanonische_aufnahme_runs'] == [31451843387, 31451843376, 31451843400, 31451843389, 31451843386]

          v = d['validierungsgrenze']
          for key in (
              'aufnahmevorschau', 'transaktionsengine', 'rollback_fault_injection',
              'lifecycle_gate_split', 'kanonische_vier_artefakt_aufnahme_main'):
              assert v[key] == 'PASS_PROMOVIERT', (key, v[key])
          for key in (
              'kanonische_post_intake_qualification', 'delta_append_only',
              'browser_derivative_sync', 'qualification_receipt_gate',
              'single_commit_qualification'):
              assert v[key] == 'PASS', (key, v[key])
          assert v['produktfreigabe'] == 'NICHT_BETROFFEN'
          PY

      - name: I015.2H bleibt read-only zur Produktlogik
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$CHANGED"
          ALLOWED='^(docs/I015_2G_MASTERBUCH_AUFNAHME_STATUS\.json|\.github/workflows/i015-2h-masterbook-sync\.yml)$'
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev "$ALLOWED" || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo 'Unerwartete Datei im I015.2H-Synchronisations-PR:' >&2
            printf '%s\n' "$UNEXPECTED" >&2
            exit 1
          fi
