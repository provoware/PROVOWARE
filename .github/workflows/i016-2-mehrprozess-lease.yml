name: I016.2 Mehrprozess-Lease

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/platform/test_datei_lease_mehrprozess.py"
      - "docs/WISSENSSPEICHER_I016_2_ERKENNTNIS.json"
      - "docs/ITERATION_016_2.md"
      - ".github/workflows/i016-2-mehrprozess-lease.yml"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scope fail-closed pruefen
        run: |
          python3 - <<'PY'
          import os, subprocess
          allowed={
            'tests/platform/test_datei_lease_mehrprozess.py',
            'docs/WISSENSSPEICHER_I016_2_ERKENNTNIS.json',
            'docs/ITERATION_016_2.md',
            '.github/workflows/i016-2-mehrprozess-lease.yml',
          }
          base=os.environ['GITHUB_BASE_REF']
          changed={p for p in subprocess.check_output(['git','diff','--name-only',f'origin/{base}...HEAD'],text=True).splitlines() if p}
          assert changed == allowed, f'I016.2-Scope abweichend: {sorted(changed)}'
          PY

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Testwerkzeug installieren
        run: python -m pip install pytest==9.1.1 ruff==0.16.1

      - name: Mehrprozess-Lease qualifizieren
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/platform/test_datei_lease_mehrprozess.py

      - name: Statische Qualitaet
        run: |
          python -m ruff check tests/platform/test_datei_lease_mehrprozess.py
          python -m ruff format --check tests/platform/test_datei_lease_mehrprozess.py

      - name: Bestehende Phase-1-Tests revalidieren
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/platform/test_datei_lease.py

      - name: Offene Grenzen muessen offen bleiben
        run: |
          grep -q 'NICHT_QUALIFIZIERT' docs/ITERATION_016_2.md
          grep -q 'NICHT_IMPLEMENTIERT' docs/ITERATION_016_2.md
          python3 - <<'PY'
          import json
          d=json.load(open('docs/WISSENSSPEICHER_I016_2_ERKENNTNIS.json', encoding='utf-8'))
          assert d['reifegrad']=='E1'
          assert d['prioritaet']=='P0'
          assert d['status']=='IN_PRUEFUNG'
          assert d['goldene_regel'] is False
          PY
