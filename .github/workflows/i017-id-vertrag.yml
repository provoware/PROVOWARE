name: I017 ID-Vertragskern

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/contract/test_i017_id_vertrag.py"
      - "docs/WISSENSSPEICHER_I017_ERKENNTNIS.json"
      - "docs/ITERATION_017.md"
      - ".github/workflows/i017-id-vertrag.yml"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: I017-Scope fail-closed prüfen
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          allowed = {
              'tests/contract/test_i017_id_vertrag.py',
              'docs/WISSENSSPEICHER_I017_ERKENNTNIS.json',
              'docs/ITERATION_017.md',
              '.github/workflows/i017-id-vertrag.yml',
          }
          base = os.environ['GITHUB_BASE_REF']
          changed = {
              p for p in subprocess.check_output(
                  ['git', 'diff', '--name-only', f'origin/{base}...HEAD'], text=True
              ).splitlines() if p
          }
          assert changed == allowed, f'I017-Scope abweichend: {sorted(changed)}'
          assert not any(p.startswith(('src/', 'data/', 'EVIDENCE/')) for p in changed)
          PY

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Testwerkzeug installieren
        run: python -m pip install pytest==9.1.1 ruff==0.16.1 mypy==2.3.0

      - name: I017 ID-Vertrag qualifizieren
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/contract/test_i017_id_vertrag.py
          python -m pytest -q tests/contract/test_datentypen.py tests/contract/test_id_varianten.py

      - name: Statische Qualität
        run: |
          python -m ruff check tests/contract/test_i017_id_vertrag.py
          python -m ruff format --check tests/contract/test_i017_id_vertrag.py
          python -m mypy src/provoware/vertraege/datentypen.py

      - name: Wissensschema und Grenzen fail-closed prüfen
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path('docs/WISSENSSPEICHER_I017_ERKENNTNIS.json').read_text(encoding='utf-8'))
          assert evidence['id'] == 'ERK-I017-001'
          assert evidence['typ'] == 'Regelentwurf'
          assert evidence['hauptkategorie'] == 'Architektur'
          assert evidence['reifegrad'] == 'E1'
          assert evidence['prioritaet'] == 'P0'
          assert evidence['automatisierbarkeit'] == 'JA'
          assert evidence['status'] == 'IN_PRUEFUNG'
          assert evidence['goldene_regel'] is False
          assert evidence['widersprueche'] == []

          doc = Path('docs/ITERATION_017.md').read_text(encoding='utf-8')
          for marker in (
              'PERSISTENZ_ANBINDUNG = NICHT_IMPLEMENTIERT',
              'REGISTRY_ANBINDUNG = NICHT_IMPLEMENTIERT',
              'KOLLISIONSFREIHEIT = NICHT_BEWIESEN',
              'E1 / P0 / IN_PRUEFUNG',
          ):
              assert marker in doc
          PY
