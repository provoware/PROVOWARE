name: I017.1H Metadatenabschluss

on:
  pull_request:
    paths:
      - 'PROJEKTSTATUS.json'
      - 'CHANGELOG.md'
      - 'docs/ITERATION_017_1.md'
      - '.github/workflows/i017-1-id-persistenz.yml'
      - '.github/workflows/i017h-metadatenabschluss.yml'
      - '.github/workflows/i017-1h-metadatenabschluss.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i017-1h-metadatenabschluss:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Exakten Metadaten-Scope pruefen
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: python
        run: |
          import os
          import subprocess

          expected = {
              'PROJEKTSTATUS.json',
              'CHANGELOG.md',
              'docs/ITERATION_017_1.md',
              '.github/workflows/i017-1-id-persistenz.yml',
              '.github/workflows/i017h-metadatenabschluss.yml',
              '.github/workflows/i017-1h-metadatenabschluss.yml',
          }
          base = os.environ['BASE_SHA']
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', base, 'HEAD'],
                  text=True,
              ).splitlines()
          )
          assert changed == expected, (changed, expected)

      - name: I017.1 Qualification und Grenzen pruefen
        shell: python
        run: |
          import json
          from pathlib import Path

          status = json.loads(Path('PROJEKTSTATUS.json').read_text(encoding='utf-8'))
          q = status['i017_id_persistenz_restart_qualifikation']
          assert q['funktionaler_workflow_run_id'] == 31536871890
          assert q['funktionaler_qualifikations_head'] == '1a0a6d85e0547d6f1e0b395281a490828d40491c'
          assert q['workflow_run_id'] == 31536951091
          assert q['github_qualifikations_head'] == '739f0b8368ad79f418a800d5d98b5aea70e0ab54'
          assert q['github_main_merge_commit'] == '0d2e6c8d2e042527274fb2428efe635dbbb337cc'
          assert q['masterbuch_main_merge_commit'] == '5d4be8436e12937dff5e3a50aedfb8804782e0a1'
          assert q['status'] == 'VALIDIERT_GITHUB'
          assert q['workflow_status'] == 'completed'
          assert q['workflow_conclusion'] == 'success'
          assert q['persistenz_anbindung'] == 'QUALIFIZIERT'
          assert q['restart_erhalt'] == 'GRUEN'
          assert q['konflikt_semantik'] == 'GRUEN'
          assert q['beschaedigte_persistenz'] == 'FAIL_CLOSED_GRUEN'
          assert q['registry_anbindung'] == 'NICHT_IMPLEMENTIERT'
          assert q['uuid4_kollisionsfreiheit'] == 'NICHT_BEWIESEN'
          assert q['crash_atomizitaet'] == 'NICHT_QUALIFIZIERT'
          assert q['netzwerkdateisysteme'] == 'NICHT_QUALIFIZIERT'

          assert status['letzte_abgeschlossene_iteration'] == 'I016'
          assert status['naechste_iteration'] == 'I017'
          assert status['p04_fortschritt_prozent'] == 20
          assert status['status'] == 'IN_ARBEIT'
          assert 'I018 Registry wird nicht vorgezogen' in status['p04_hinweis']

      - name: Dokumentationskonsistenz pruefen
        shell: python
        run: |
          from pathlib import Path

          marker = (
              '31536871890',
              '31536951091',
              '739f0b8368ad79f418a800d5d98b5aea70e0ab54',
              '0d2e6c8d2e042527274fb2428efe635dbbb337cc',
              '5d4be8436e12937dff5e3a50aedfb8804782e0a1',
              'NICHT_IMPLEMENTIERT',
              'NICHT_BEWIESEN',
              'NICHT_QUALIFIZIERT',
          )
          for path in ('CHANGELOG.md', 'docs/ITERATION_017_1.md'):
              text = Path(path).read_text(encoding='utf-8')
              for wert in marker:
                  assert wert in text, (path, wert)

      - name: Historische Candidate-Gates eingefroren
        shell: python
        run: |
          from pathlib import Path

          for path in (
              '.github/workflows/i017-1-id-persistenz.yml',
              '.github/workflows/i017h-metadatenabschluss.yml',
          ):
              pre = Path(path).read_text(encoding='utf-8').split('permissions:', 1)[0]
              assert 'workflow_dispatch:' in pre
              assert 'pull_request:' not in pre

      - name: Keine Produkt- oder Testmutation
        shell: python
        run: |
          from pathlib import Path

          status = Path('PROJEKTSTATUS.json').read_text(encoding='utf-8')
          assert 'I017.1 Persistenz/Restart qualifiziert' in status
          assert 'I017-Abschlussbewertung offen' in status
