name: I018.2 Registry-Contract-Fingerprint

on:
  pull_request:
    paths:
      - 'src/provoware/vertraege/registry.py'
      - 'tests/contract/test_i018_registry.py'
      - 'docs/ITERATION_018_2.md'
      - 'docs/WISSENSSPEICHER_I018_2_ERKENNTNIS.json'
      - '.github/workflows/i018-1-registry-source-fingerprint.yml'
      - '.github/workflows/i018-2-registry-contract-fingerprint.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  qualifikation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Entwicklungsabhängigkeiten installieren
        run: python -m pip install -e '.[entwicklung]'
      - name: I018 Registry-Vertrag
        run: python -m pytest -q tests/contract/test_i018_registry.py
      - name: Gesamtregression
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check src tests
      - name: Ruff Format
        run: python -m ruff format --check src tests
      - name: mypy
        run: python -m mypy src
      - name: Historisches I018.1-Gate eingefroren
        run: |
          python - <<'PY'
          from pathlib import Path
          pre = Path('.github/workflows/i018-1-registry-source-fingerprint.yml').read_text().split('permissions:', 1)[0]
          assert 'workflow_dispatch:' in pre
          assert 'pull_request:' not in pre
          assert 'push:' not in pre
          print('Historisches I018.1-Candidate-Gate: workflow_dispatch-only')
          PY
      - name: E1-Wissensstatus fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('docs/WISSENSSPEICHER_I018_2_ERKENNTNIS.json').read_text())
          assert data['erkenntnis_id'] == 'ERK-I018-003'
          assert data['typ'] == 'Nachweis'
          assert data['hauptkategorie'] == 'Architektur'
          assert data['reifegrad'] == 'E1'
          assert data['prioritaet'] == 'P0'
          assert data['automatisierbarkeit'] == 'JA'
          assert data['status'] == 'KANDIDAT'
          assert data['goldene_regel'] is False
          assert data['widersprueche'] == []
          assert data['qualification']['status'] == 'AUSSTEHEND'
          assert data['qualification']['pass_real'] is False
          PY
      - name: Scope fail-closed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          test -n "$PR"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" --paginate --jq '.[].filename' | sort > /tmp/files
          cat > /tmp/allowed <<'EOF'
          .github/workflows/i018-1-registry-source-fingerprint.yml
          .github/workflows/i018-2-registry-contract-fingerprint.yml
          docs/ITERATION_018_2.md
          docs/WISSENSSPEICHER_I018_2_ERKENNTNIS.json
          src/provoware/vertraege/registry.py
          tests/contract/test_i018_registry.py
          EOF
          sort -o /tmp/allowed /tmp/allowed
          diff -u /tmp/allowed /tmp/files
      - name: Abschluss
        run: echo 'I018.2 Registry-Contract-Fingerprint qualifiziert'
