name: I016.1 Metadatenabschluss

# Historisches Qualification-Gate. Der ursprüngliche PR-Lifecycle ist abgeschlossen.
# Spätere PROJEKTSTATUS-/CHANGELOG-/I016-Dokumentationsänderungen dürfen diesen
# Candidate-Scope nicht erneut als aktuelle Qualification interpretieren.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historische_evidence:
    name: Historische I016.1-Evidence read-only prüfen
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Historische Phase-1-Evidence binden
        shell: python
        run: |
          import json
          from pathlib import Path

          status = json.loads(Path('PROJEKTSTATUS.json').read_text(encoding='utf-8'))
          q = status['i016_datei_lease_phase1_qualifikation']
          assert q['status'] == 'VALIDIERT_GITHUB'
          assert q['scope'] == 'PHASE_1_LEASE_KERN'
          assert q['workflow_run_id'] == 31476216289
          assert q['i015_revalidation_workflow_run_id'] == 31476216369
          assert q['github_qualifikations_head'] == '4eea4591ae2296961869f567498744372aa7ff11'
          assert q['github_main_merge_commit'] == 'cfb9d67966ba737eb1331004890973ed2404f3ff'
          assert q['artifact_id'] == 9095330662
          assert q['artifact_bytes'] == 899
          assert q['artifact_sha256'] == 'fd7d62679176faf3a3dcd90b7675f492e40b620c9fb5a7035273a1f5876b2ec6'
          assert q['nicht_kooperierende_schreiber'] == 'NICHT_QUALIFIZIERT'
          assert q['netzwerkdateisysteme'] == 'NICHT_QUALIFIZIERT'
          assert q['replace_integration'] == 'NICHT_IMPLEMENTIERT'
