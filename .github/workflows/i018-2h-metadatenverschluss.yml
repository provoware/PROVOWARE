name: I018.2H Metadatenverschluss

on:
  pull_request:
    paths:
      - 'PROJEKTSTATUS.json'
      - 'CHANGELOG.md'
      - 'docs/I018_2H_METADATENVERSCHLUSS.json'
      - '.github/workflows/i018-1h-metadatenverschluss.yml'
      - '.github/workflows/i018-2h-metadatenverschluss.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  metadatenverschluss:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: JSON und Lifecycle-Invarianten prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('PROJEKTSTATUS.json').read_text())
          proof = json.loads(Path('docs/I018_2H_METADATENVERSCHLUSS.json').read_text())
          baseline = json.loads(Path('CURRENT_BASELINE.json').read_text())
          handoff = json.loads(Path('ITERATIONSUEBERGABE.json').read_text())

          q = status.get('i018_2_registry_contract_fingerprint_qualifikation', {})
          assert q.get('status') == 'VALIDIERT_GITHUB'
          assert q.get('tool_pr') == 49
          assert q.get('workflow_run_id') == 31605278784
          assert q.get('workflow_conclusion') == 'success'
          assert q.get('github_qualifikations_head') == '21a7a2e95340fe2abfa371161d98487e3a04e8ac'
          assert q.get('github_main_merge_commit') == '5fa8eca05bfbebe50898fafad26d31d7f26a14fd'
          assert q.get('masterbuch_hardening_run_id') == 31610977691
          assert q.get('masterbuch_main_merge_commit') == '8ba463735908a66175cc9c59886c392817072986'
          assert q.get('masterbuch_evidence') == 'ERK-I018-003'
          assert q.get('evidence_binding') == 'PASS_REAL'
          assert q.get('contract_fingerprint') == 'SHA256_KANONISCHE_VERTRAGSREPRAESENTATION_QUALIFIZIERT'
          assert q.get('contract_pin') == 'FAIL_CLOSED_GRUEN'
          assert q.get('source_contract_trennung') == 'GRUEN'
          assert q.get('registry_persistenz') == 'NICHT_IMPLEMENTIERT'
          assert q.get('automatische_quellensuche') == 'NICHT_IMPLEMENTIERT'
          assert q.get('signatur_herkunftsgarantie') == 'NICHT_QUALIFIZIERT'
          assert q.get('source_contract_binding_receipt') == 'NICHT_IMPLEMENTIERT'
          assert q.get('mehrprojekt_registry') == 'NICHT_IMPLEMENTIERT'
          assert q.get('gui') == 'NICHT_IMPLEMENTIERT'

          assert status.get('letzte_abgeschlossene_iteration') == 'I017'
          assert status.get('naechste_iteration') == 'I018'
          assert 80 < status.get('p04_fortschritt_prozent', 0) < 100
          assert baseline.get('letzte_iteration') == 'I017'
          assert baseline.get('naechste_iteration') == 'I018'
          assert handoff.get('next_iteration') == 'I018'

          assert proof.get('status') == 'KANDIDAT'
          mb = proof.get('masterbuch_evidence', {})
          assert mb.get('erk_id') == 'ERK-I018-003'
          assert mb.get('typ') == 'Nachweis'
          assert mb.get('hauptkategorie') == 'Architektur'
          assert mb.get('reifegrad') == 'E2'
          assert mb.get('prioritaet') == 'P0'
          assert mb.get('automatisierbarkeit') == 'JA'
          assert mb.get('status') == 'BESTAETIGT'
          assert mb.get('goldene_regel') is False
          assert mb.get('widersprueche') == []
          assert mb.get('evidence_binding') == 'PASS_REAL'
          assert mb.get('masterbuch_hardening_run_id') == 31610977691
          assert mb.get('masterbuch_main_merge_commit') == '8ba463735908a66175cc9c59886c392817072986'
          mutation = proof.get('mutation', {})
          assert all(value is False for value in mutation.values())
          PY

      - name: Changelog-Evidence prüfen
        run: |
          grep -F 'I018.2H' CHANGELOG.md
          grep -F '31605278784' CHANGELOG.md
          grep -F '5fa8eca05bfbebe50898fafad26d31d7f26a14fd' CHANGELOG.md
          grep -F '31610977691' CHANGELOG.md
          grep -F '8ba463735908a66175cc9c59886c392817072986' CHANGELOG.md
          grep -F 'ERK-I018-003' CHANGELOG.md
          grep -F 'PASS_REAL' CHANGELOG.md

      - name: Historisches I018.1H-Gate eingefroren prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          pre = Path('.github/workflows/i018-1h-metadatenverschluss.yml').read_text().split('permissions:', 1)[0]
          assert 'workflow_dispatch:' in pre
          assert 'pull_request:' not in pre
          assert 'push:' not in pre
          print('Historisches I018.1H-Gate: workflow_dispatch-only')
          PY

      - name: Exakten Metadaten-Scope fail-closed prüfen
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          allowed = {
              'PROJEKTSTATUS.json',
              'CHANGELOG.md',
              'docs/I018_2H_METADATENVERSCHLUSS.json',
              '.github/workflows/i018-1h-metadatenverschluss.yml',
              '.github/workflows/i018-2h-metadatenverschluss.yml',
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/pulls/{os.environ['PR']}/files?per_page=100",
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
              },
          )
          with urllib.request.urlopen(req) as r:
              files = {x['filename'] for x in json.load(r)}
          assert files == allowed, (files, allowed)
          assert not any(p.startswith(('src/', 'tests/', 'data/', 'evidence/')) for p in files)
          PY

      - name: Abschluss
        run: echo 'I018.2H Metadatenverschluss qualifiziert'
