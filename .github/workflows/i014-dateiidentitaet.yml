name: I014 Read-only Dateiidentitaet

on:
  pull_request:
    branches: [main]
    paths:
      - "src/provoware/plattform/dateiidentitaet.py"
      - "tests/platform/test_dateiidentitaet.py"
      - "docs/WISSENSSPEICHER_I014_ERKENNTNIS.json"
      - "docs/ITERATION_014.md"
      - ".github/workflows/i014-dateiidentitaet.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: i014-dateiidentitaet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Python 3.13.15 / Dateiidentitaet + Stale-Guard
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      I005_RUN_ID: "31330952896"
      I005_ARTIFACT_ID: "9042907351"
      I005_ARTIFACT_SHA256: "6856c44cfd079b96f0daaa8e0fcebbba2dbbf5d0f1a3f16e02730f5851751040"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONHASHSEED: "0"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - name: Repository auschecken
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: CPython 3.13.15 bereitstellen
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Verifiziertes I005-Wheelhouse laden
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          artifact-ids: ${{ env.I005_ARTIFACT_ID }}
          path: .artefakte/i005-download
          github-token: ${{ github.token }}
          repository: provoware/PROVOWARE
          run-id: ${{ env.I005_RUN_ID }}
          skip-decompress: true
          digest-mismatch: error

      - name: Wheelhouse pruefen und Toolchain offline installieren
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t ZIPS < <(find .artefakte/i005-download -type f -name '*.zip' -print)
          test ${#ZIPS[@]} -eq 1
          printf '%s  %s\n' "$I005_ARTIFACT_SHA256" "${ZIPS[0]}" | sha256sum -c -
          mkdir -p .artefakte/i005
          unzip -q "${ZIPS[0]}" -d .artefakte/i005
          python3 -m venv .venv-i014
          PIP_NO_INDEX=1 .venv-i014/bin/python -m pip install --no-index \
            --find-links "$PWD/.artefakte/i005/wheelhouse" pytest==9.1.1 ruff==0.16.1 mypy==2.3.0
          PIP_NO_INDEX=1 .venv-i014/bin/python -m pip check

      - name: I014 Qualifikationsanker revalidieren
        run: |
          python3 WERKZEUGE/baseline_pruefen.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('CURRENT_BASELINE.json').read_text(encoding='utf-8'))
          status = json.loads(Path('PROJEKTSTATUS.json').read_text(encoding='utf-8'))
          assert baseline['status'] == 'VALIDIERT_GITHUB'
          assert status['i014_dateiidentitaet_qualifikation']['status'] == 'VALIDIERT_GITHUB'
          assert status['i014_dateiidentitaet_qualifikation']['workflow_run_id'] == 31373576096
          PY

      - name: I014 Contracttests
        run: .venv-i014/bin/pytest -q tests/platform/test_dateiidentitaet.py

      - name: I011 bis I013 Plattformregression
        run: >-
          .venv-i014/bin/pytest -q
          tests/platform/test_dateisystem_probe.py
          tests/platform/test_pfadnormalisierung.py
          tests/platform/test_linux_systemprofil.py

      - name: Ruff pruefen
        run: |
          .venv-i014/bin/ruff check src/provoware/plattform tests/platform
          .venv-i014/bin/ruff format --check src/provoware/plattform tests/platform

      - name: mypy strict pruefen
        run: >-
          .venv-i014/bin/mypy
          src/provoware/plattform
          tests/platform/test_dateiidentitaet.py

      - name: P02 Regression im P03-Laufzeitmodus
        run: >-
          .venv-i014/bin/pytest -q tests/contract tests/architecture
          -k "not test_p02_quellinventar_ist_exakt_und_hashgebunden and not test_i010_gesamtgate_ist_im_aktuellen_lebenszykluszustand_gruen and not test_traceability_passt_zum_aktuellen_i010_lebenszykluszustand"

      - name: Gesamte schnelle Regression im P03-Laufzeitmodus
        run: >-
          .venv-i014/bin/pytest -q
          -k "not test_p02_quellinventar_ist_exakt_und_hashgebunden and not test_i010_gesamtgate_ist_im_aktuellen_lebenszykluszustand_gruen and not test_traceability_passt_zum_aktuellen_i010_lebenszykluszustand and not test_i009_implementiert_nur_vertrags_schema_und_operationsschicht"

      - name: I014 Qualifikationsreceipt erzeugen
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .artefakte/I014
          .venv-i014/bin/python - <<'PY'
          import hashlib, json, os, platform
          from datetime import UTC, datetime
          from pathlib import Path
          def sha(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          receipt = {
              'schema': '1.0.0', 'iteration': 'I014', 'phase': 'P03', 'status': 'GRUEN',
              'zeit_utc': datetime.now(UTC).isoformat(),
              'github': {'repository': os.environ['GITHUB_REPOSITORY'], 'sha': os.environ['GITHUB_SHA'], 'run_id': int(os.environ['GITHUB_RUN_ID'])},
              'plattform': {'python': platform.python_version(), 'system': platform.system(), 'maschine': platform.machine()},
              'quellen_sha256': {
                  'dateiidentitaet_py': sha('src/provoware/plattform/dateiidentitaet.py'),
                  'tests': sha('tests/platform/test_dateiidentitaet.py'),
                  'wissen': sha('docs/WISSENSSPEICHER_I014_ERKENNTNIS.json'),
                  'plan_delta': sha('docs/PLAN_DELTA_I014.json'),
              },
              'gates': {
                  'i014_qualifikationsanker': 'GRUEN', 'deterministische_identitaet': 'GRUEN',
                  'unchanged_recheck': 'GRUEN', 'inode_exchange_stale': 'GRUEN',
                  'stat_change_stale': 'GRUEN', 'missing_negative': 'GRUEN',
                  'lstat_error_negative': 'GRUEN', 'non_mutation': 'GRUEN',
                  'i011_i013_regression': 'GRUEN', 'ruff': 'GRUEN',
                  'ruff_format': 'GRUEN', 'mypy_strict': 'GRUEN',
                  'p02_runtime_regression': 'GRUEN', 'gesamtregression': 'GRUEN'
              }
          }
          Path('.artefakte/I014/I014_QUALIFIKATION.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: I014 Evidence hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PROVOWARE-I014-dateiidentitaet-${{ github.sha }}
          path: .artefakte/I014/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
