name: I006 Offline-Clean-Bootstrap Qualifikation

on:
  workflow_dispatch:
  push:
    branches:
      - iteration/i006-clean-bootstrap
    paths:
      - ".github/workflows/i006-clean-bootstrap.yml"
      - "WERKZEUGE/bootstrap_pruefen.py"
      - "WERKZEUGE/clean-bootstrap.sh"
      - "WERKZEUGE/baseline_pruefen.py"
      - "WERKZEUGE/WHEELHOUSE_STATUS.json"
      - "WERKZEUGE/wheelhouse-anforderungen.txt"
      - "tests/test_baseline.py"
      - "tests/test_i006_bootstrap_contract.py"
      - "pyproject.toml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/i006-clean-bootstrap.yml"
      - "WERKZEUGE/bootstrap_pruefen.py"
      - "WERKZEUGE/clean-bootstrap.sh"
      - "WERKZEUGE/baseline_pruefen.py"
      - "WERKZEUGE/WHEELHOUSE_STATUS.json"
      - "WERKZEUGE/wheelhouse-anforderungen.txt"
      - "tests/test_baseline.py"
      - "tests/test_i006_bootstrap_contract.py"
      - "pyproject.toml"

permissions:
  contents: read
  actions: read

concurrency:
  group: i006-clean-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-bootstrap:
    name: Zwei Offline-Neuaufbauten / Ubuntu 22.04 / Python 3.13.15
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      I005_ARTIFACT_ID: "9042907351"
      I005_RUN_ID: "31330952896"
      I005_ARTIFACT_SHA256: "6856c44cfd079b96f0daaa8e0fcebbba2dbbf5d0f1a3f16e02730f5851751040"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONHASHSEED: "0"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - name: Repository auschecken
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: CPython 3.13.15 und pip 25.2 bereitstellen
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.15"
          pip-version: "25.2"
          check-latest: false

      - name: I005-Artefakt bytegenau herunterladen
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          artifact-ids: "9042907351"
          path: .artefakte/i005-download
          github-token: ${{ github.token }}
          repository: provoware/PROVOWARE
          run-id: "31330952896"
          skip-decompress: "true"
          digest-mismatch: error

      - name: Äußeren Artefakt-Hash prüfen und entpacken
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t ZIPS < <(find .artefakte/i005-download -type f -name '*.zip' -print)
          if [[ ${#ZIPS[@]} -ne 1 ]]; then
            echo "I006 BLOCKIERT: genau ein I005-ZIP erwartet, gefunden ${#ZIPS[@]}" >&2
            exit 1
          fi
          ZIP="${ZIPS[0]}"
          printf '%s  %s\n' "$I005_ARTIFACT_SHA256" "$ZIP" | sha256sum -c -
          mkdir -p .artefakte/i005
          unzip -q "$ZIP" -d .artefakte/i005
          echo "I005_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: I005-Inhalt vor Bootstrap vollständig verifizieren
        shell: bash
        run: |
          python3 WERKZEUGE/bootstrap_pruefen.py \
            --i005-root .artefakte/i005 \
            --status WERKZEUGE/WHEELHOUSE_STATUS.json \
            --json-out .artefakte/I006/I005_BASIS_PRUEFUNG.json

      - name: Clean-Bootstrap A
        shell: bash
        run: |
          bash WERKZEUGE/clean-bootstrap.sh \
            --i005-root .artefakte/i005 \
            --ziel .artefakte/bootstrap-a \
            --receipt .artefakte/I006/BOOTSTRAP_A_RECEIPT.json

      - name: Clean-Bootstrap B
        shell: bash
        run: |
          bash WERKZEUGE/clean-bootstrap.sh \
            --i005-root .artefakte/i005 \
            --ziel .artefakte/bootstrap-b \
            --receipt .artefakte/I006/BOOTSTRAP_B_RECEIPT.json

      - name: Reproduzierbarkeit A gegen B prüfen
        shell: bash
        run: |
          set -Eeuo pipefail
          cmp --silent \
            .artefakte/bootstrap-a/PAKET_FREEZE.txt \
            .artefakte/bootstrap-b/PAKET_FREEZE.txt
          cp .artefakte/bootstrap-a/PAKET_FREEZE.txt .artefakte/I006/BOOTSTRAP_FREEZE.txt
          sha256sum .artefakte/I006/BOOTSTRAP_FREEZE.txt

      - name: I006-Qualifikationsreceipt erzeugen
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          root = Path('.artefakte/I006')

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()

          a = json.loads((root / 'BOOTSTRAP_A_RECEIPT.json').read_text(encoding='utf-8'))
          b = json.loads((root / 'BOOTSTRAP_B_RECEIPT.json').read_text(encoding='utf-8'))
          if a['bootstrap']['paket_freeze_sha256'] != b['bootstrap']['paket_freeze_sha256']:
              raise SystemExit('I006 BLOCKIERT: Freeze-Hashes A/B weichen ab.')

          receipt = {
              'schema': '1.0.0',
              'iteration': 'I006',
              'status': 'GRUEN',
              'zeit_utc': datetime.now(UTC).isoformat(),
              'github': {
                  'repository': os.environ.get('GITHUB_REPOSITORY'),
                  'sha': os.environ.get('GITHUB_SHA'),
                  'run_id': os.environ.get('GITHUB_RUN_ID'),
                  'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              },
              'i005_artifact': {
                  'id': int(os.environ['I005_ARTIFACT_ID']),
                  'source_run_id': int(os.environ['I005_RUN_ID']),
                  'sha256': os.environ['I005_ARTIFACT_SHA256'],
                  'content_check': 'GRUEN',
              },
              'bootstrap': {
                  'durchlaeufe': 2,
                  'freeze_identisch': True,
                  'freeze_sha256': a['bootstrap']['paket_freeze_sha256'],
                  'pip_no_index': True,
                  'proxy_falle': '127.0.0.1:9',
                  'pip_check': 'GRUEN',
                  'projektinstallation': 'GRUEN',
                  'baseline': 'GRUEN',
                  'pytest': 'GRUEN',
                  'ruff': 'GRUEN',
                  'import_smoke': 'GRUEN',
              },
              'evidence': {
                  'bootstrap_a_sha256': sha256(root / 'BOOTSTRAP_A_RECEIPT.json'),
                  'bootstrap_b_sha256': sha256(root / 'BOOTSTRAP_B_RECEIPT.json'),
                  'freeze_file_sha256': sha256(root / 'BOOTSTRAP_FREEZE.txt'),
                  'i005_basis_pruefung_sha256': sha256(root / 'I005_BASIS_PRUEFUNG.json'),
              },
          }
          (root / 'I006_QUALIFIKATION.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: I006-Evidence hochladen
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PROVOWARE-I006-clean-bootstrap-${{ github.sha }}
          path: .artefakte/I006/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

      - name: Ergebnis zusammenfassen
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          {
            echo "## I006 — Offline-Clean-Bootstrap GRÜN"
            echo
            echo "- zwei vollständige Neuaufbauten"
            echo "- I005 äußere und interne Hashprüfung GRÜN"
            echo "- PIP_NO_INDEX + --no-index + Proxy-Falle"
            echo "- Paket-Freeze A/B identisch"
            echo "- Projektprüfung in beiden Umgebungen GRÜN"
            echo "- Artifact-ID: ${ARTIFACT_ID}"
            echo "- Artifact-Digest: ${ARTIFACT_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
